name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: Lint + tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, openssl
          coverage: none

      - name: Prepare config
        run: cp lunchslot/config.example.php lunchslot/config.php

      - name: Lint (php -l) on all PHP files
        run: |
          set -e
          find lunchslot -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run test suite
        run: php lunchslot/tests/run.php
